# Dependabot keeps GitHub Actions and Python deps up to date.
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Workflows pin actions to a commit SHA with a `# vX.Y.Z` comment.
  # This ecosystem bumps that SHA; it does not follow a floating tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # uv, not pip. The pip ecosystem does not update uv.lock, and CI runs
  # `uv sync --locked`, so a pip-style bump turns the lockfile red.
  # https://docs.astral.sh/uv/guides/integration/dependabot/
  - package-ecosystem: "uv"
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
