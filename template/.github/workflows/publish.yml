name: Publish to PyPI

on:
  release:
    types: [published]
  # Re-run from the release tag. A branch dispatch has no vX.Y.Z tag, so
  # uv-dynamic-versioning emits a local version that PyPI rejects.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v7
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          # Publish jobs stay off the Actions cache. setup-uv already skips
          # caching for release events when this is "auto"; false also covers
          # workflow_dispatch.
          enable-cache: false
          python-version: "3.13"

      - name: Install all dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -n auto --cov --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@release/v1
