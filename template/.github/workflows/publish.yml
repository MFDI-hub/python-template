name: Publish to PyPI

# Automatic releases: release.yml dispatches this workflow on the new tag.
# A GITHUB_TOKEN release does not fire `release: published` (see release.yml).
# Manual GitHub Releases do fire that event, which is the other entry point.
#
# Trusted publishing is registered against THIS file (`publish.yml`) and the
# GitHub Environment named below. PyPI does not accept a reusable workflow
# as the trusted publisher. https://docs.pypi.org/trusted-publishers/troubleshooting/

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Create a GitHub Environment with this name. Required reviewers on it
    # hold the publish until someone approves. TestPyPI is a separate
    # environment and a separate trusted publisher on test.pypi.org.
    environment: ${{ github.event.inputs.repository == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          # Publish jobs stay off the Actions cache. setup-uv already skips
          # caching for release events when this is "auto"; false also covers
          # workflow_dispatch.
          enable-cache: false
          python-version: "3.13"

      - name: Install all dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -n auto --cov --cov-report=term-missing

      - name: Build package
        # --no-sources is uv's recommendation for artifacts you publish:
        # the wheel must not depend on a local path or workspace source.
        run: uv build --no-sources

      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          whl="$(echo dist/*.whl)"
          if [ ! -f "${whl}" ]; then
            echo "expected one wheel, found: ${whl}" >&2
            exit 1
          fi
          uv run --with "${whl}" --no-project -- python -c 'import importlib, pathlib, sys, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit("expected one wheel in dist/, found " + repr(wheels))
          with zipfile.ZipFile(wheels[0]) as zf:
              tops = sorted({
                  name.split("/", 1)[0]
                  for name in zf.namelist()
                  if name.endswith("/__init__.py") and name.count("/") == 1
              })
          if len(tops) != 1:
              sys.exit("expected one importable package, found " + repr(tops))
          importlib.import_module(tops[0])
          print("imported", tops[0], "from", wheels[0].name)
          '

      - name: Publish to PyPI
        env:
          PUBLISH_TARGET: ${{ github.event.inputs.repository || 'pypi' }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_TARGET}" = "testpypi" ]; then
            uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
          else
            uv publish --trusted-publishing always
          fi
          # uv publish uploads attestation files that already sit next to the
          # artifacts. It does not generate them. See docs/publishing.md.
