name: Semantic Release

# Creates a GitHub Release (and tag) from Conventional Commits on main/master.
# Version numbers come from the tag via uv-dynamic-versioning (no pyproject.toml
# rewrite).
#
# A release created with the default GITHUB_TOKEN does not start other
# workflows. This job therefore dispatches publish.yml on the new tag.
# Keep GITHUB_TOKEN here. A PAT or GitHub App token would also fire the
# `release` trigger, and publish.yml would run twice.
# Manual GitHub Releases still trigger publish.yml via `release: published`.
# See docs/publishing.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# actions: write is what lets GITHUB_TOKEN call `gh workflow run`.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: "26.0.1"
          # package.json exists so semantic-release can load .releaserc.yml.
          # skip_npm_plugin replaces the plugin list and must not publish to npm.
          skip_npm_plugin: true
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/github@12.0.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the new release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          RELEASE_SHA: ${{ steps.semantic.outputs.new_release_git_head }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::semantic-release published a release but reported no git tag"
            exit 1
          fi
          # createdAt is compared against this so a previous dispatch on the
          # same commit is not the run we watch.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatched=0
          for _ in $(seq 1 10); do
            if gh workflow run publish.yml --ref "${RELEASE_TAG}"; then
              dispatched=1
              break
            fi
            sleep 2
          done
          if [ "${dispatched}" -ne 1 ]; then
            echo "::error::could not dispatch publish.yml on ${RELEASE_TAG}"
            exit 1
          fi
          echo "Dispatched publish.yml on ${RELEASE_TAG}"
          for _ in $(seq 1 30); do
            id="$(gh run list --workflow publish.yml --limit 20 \
              --json databaseId,event,headBranch,headSha,status,createdAt \
              --jq "[.[] | select(.event==\"workflow_dispatch\" and (.headBranch==\"${RELEASE_TAG}\" or .headSha==\"${RELEASE_SHA}\") and .createdAt >= \"${before}\")] | sort_by(.createdAt) | last | .databaseId")"
            if [ -n "${id}" ] && [ "${id}" != "null" ]; then
              echo "Watching publish run ${id}"
              gh run watch "${id}" --exit-status
              exit 0
            fi
            sleep 2
          done
          echo "::error::publish.yml did not start for ${RELEASE_TAG}"
          exit 1
