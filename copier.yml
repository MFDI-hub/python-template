# Copier configuration for https://github.com/MFDI-hub/python-template
# Docs: https://copier.readthedocs.io/

_min_copier_version: "9.4.0"
_subdirectory: template
# copyright_year's default uses this extension. Install it beside Copier:
#   uvx --with jinja2-time copier copy --trust ...
_jinja_extensions:
  - jinja2_time.TimeExtension
# Generated projects start as a git repo with one "Initial template commit".
# These tasks must not run on `copier update`: `git add -A` would commit the
# user's staged work, including conflict markers.
_tasks:
  - command: git init --quiet
    when: "{{ _copier_operation == 'copy' }}"
  - command: git add -A
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit --quiet -m "chore: initial commit from MFDI-hub/python-template" --no-verify'
    when: "{{ _copier_operation == 'copy' }}"

# Users rewrite these immediately. Updating them produces a conflict every time.
_skip_if_exists:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - docs/index.md
  - CHANGELOG.md

_message_after_copy: |
  Copied successfully! Next steps:

    cd PROJECT  # skip if you copied into `.`
    uv sync                       # creates .venv and uv.lock; commit uv.lock (CI uses --locked)
    uv run pre-commit install && uv run pre-commit install --hook-type commit-msg && uv run pre-commit install --hook-type pre-push
    uv run pytest -n auto --cov   # or: make install && make

  Before publishing, search for unfilled `changeme` strings and confirm the
  metadata in pyproject.toml (name, description, author, URLs, license).
  This template ships the MIT license; see the `license` field and LICENSE.

  Then create the GitHub repo and push:

    git remote add origin git@github.com:OWNER/PROJECT.git
    git branch -M main
    git push -u origin main

  Releases: commit with Conventional Commits (`uv run cz commit`).
  release.yml tags the repo and dispatches publish.yml. See docs/publishing.md.

_message_after_update: |
  Template updated. Resolve any conflict markers, then refresh the environment
  and re-run checks:

    uv sync
    uv run pre-commit install && uv run pre-commit install --hook-type commit-msg && uv run pre-commit install --hook-type pre-push
    uv run python devtools/lint.py --check
    uv run pytest -n auto --cov

# ---- Questions ----

package_name:
    type: str
    help: Package name? (GitHub repo + PyPI name, e.g. CamelCase, dash-case or snake_case. "changeme" is rejected.)
    default: changeme
    validator: >-
        {% if package_name | lower == 'changeme' %}Choose a real package name. "changeme" is the prompt placeholder, not a PyPI project.{% endif %}

package_module:
    type: str
    help: Python module name? (snake_case; imported as `import <package_module>`. Press enter to derive it from the package name.)
    default: "{{ package_name | lower | replace('-', '_') | replace('.', '_') }}"
    validator: >-
        {% if not package_module.isidentifier() %}Must be a valid Python identifier: snake_case, no hyphens or spaces.{% endif %}
        {% if package_module != package_module | lower %}Must be lowercase; PyPI project names are case-insensitive, module names are not.{% endif %}

package_description:
    type: str
    help: One-line package description? (Shown on PyPI and in docs. Press enter to fill in later.)
    default: changeme

package_author_name:
    type: str
    help: Package author name? (Press enter to fill in later.)
    default: changeme

package_author_email:
    type: str
    help: Package author email? Required. This address is the vulnerability contact in SECURITY.md and the enforcement contact in CODE_OF_CONDUCT.md.
    validator: "{% if not package_author_email or '@' not in package_author_email %}Enter a real email address. It is published as the security contact.{% elif package_author_email | lower == 'changeme@example.com' %}Replace the placeholder with a mailbox you actually read.{% endif %}"

package_github_org:
    type: str
    help: GitHub org or username that will host the repo?
    default: changeme
    validator: >-
        {% if package_github_org | lower == 'changeme' %}Enter the GitHub org or username that will host the repo. "changeme" would publish dead URLs.{% endif %}

copyright_year:
    type: str
    help: Copyright year for the LICENSE? (Press enter to use the current year.)
    default: "{% now 'utc', '%Y' %}"