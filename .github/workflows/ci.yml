# Renders the Copier template and checks both this repo and one generated project.
# Downstream projects still run the full Python matrix.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Render the template and exercise a generated project
        env:
          # copier.yml's git commit task needs an identity. These do not write git config.
          GIT_AUTHOR_NAME: template-ci
          GIT_AUTHOR_EMAIL: template-ci@example.com
          GIT_COMMITTER_NAME: template-ci
          GIT_COMMITTER_EMAIL: template-ci@example.com
        run: |
          uv run python repo_check.py --keep "${RUNNER_TEMP}/tmpl"
          cd "${RUNNER_TEMP}/tmpl/dash-name"
          uv sync --all-extras
          uv run python devtools/lint.py --check
          uv run pytest -n auto --cov
          uv run demo_pkg
          uv run python -m demo_pkg
          uv run mkdocs build --strict
          uv audit --locked --preview-features audit-command
          uv build
